<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SH-101 emulator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #1d1d1f; color: #eee; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }
  h1 { font-size: 20px; margin: 4px 0 8px; }
  button, select { font: inherit; background: #333; color: #eee; border: 1px solid #555; border-radius: 8px; padding: 8px 10px; }
  button.on { background: #b5651d; border-color: #b5651d; }
  input[type=range] { width: 100%; min-width: 0; margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  #status { font-size: 13px; color: #9c9; min-height: 18px; }
  #debug { font-size: 12px; color: #888; min-height: 16px; }
  .warn { color: #e9a; }
  #keys { position: relative; height: 150px; user-select: none; touch-action: none; margin: 8px 0 12px; }
  .wk, .bk { position: absolute; top: 0; box-sizing: border-box; border: 1px solid #111; border-radius: 0 0 6px 6px; }
  .wk { background: #f2f2f2; height: 100%; color: #333; }
  .bk { background: #111; height: 60%; color: #eee; z-index: 2; }
  .on-k { background: #f0a040 !important; }
  .lbl { position: absolute; bottom: 4px; width: 100%; text-align: center; font-size: 10px; pointer-events: none; }
  #panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 8px; }
  .panel { background: #26262a; border-radius: 10px; padding: 8px 10px 10px; min-width: 0; }
  .panel h2 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #f0a040; margin: 2px 0 6px; }
  .sl { display: grid; grid-template-columns: 84px minmax(0, 1fr) 84px; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  .sl output { text-align: right; color: #aaa; font-variant-numeric: tabular-nums; font-size: 12px; }
  .grp { margin: 8px 0; }
  .grp .cap { color: #aaa; font-size: 13px; margin-bottom: 4px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button, .grp > button { flex: 1 1 auto; padding: 8px 6px; font-size: 13px; }
  #keys.folded { display: none; }
  .inline { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .inline > .grp { margin: 6px 0; flex: 0 0 auto; }
  .hrow { display: flex; gap: 12px; align-items: flex-start; margin: 6px 0; }
  .hrow > .grp { flex: 1 1 auto; min-width: 0; margin: 6px 0; }
  .hrow > .grp.stackgrp { flex: 0 0 auto; }   /* stacked buttons hug their labels */
  .vsl { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; font-size: 14px; }
  .vsl .vbox { position: relative; width: 36px; height: 150px; }
  .vsl .vbox input { position: absolute; left: -57px; top: 57px; width: 150px; height: 36px; transform: rotate(-90deg); margin: 0; }
  .vsl output { color: #aaa; font-size: 12px; font-variant-numeric: tabular-nums; }
  /* stacked buttons: one column sized to the widest label; every button stretches to that width */
  .seg.stack { display: inline-grid; grid-template-columns: max-content; gap: 6px; }
  .seg.stack button { flex: none; }
  .knobs { display: flex; flex-wrap: wrap; justify-content: space-around; gap: 6px 4px; margin: 6px 0; }
  /* AcidBox knob styles. The colours are CSS variables, so a skin only has to set these: */
:root {
  --track: rgba(240, 207, 62, 0.22);   /* empty part of the ring */
  --led: #FF5B40;                      /* filled part of the ring */
  --knob-body: #F0CF3E;                /* the dial */
  --knob-mark: #121935;                /* the pointer line */
  --ink: #F0CF3E;
  --ink-soft: #A9A487;
}

.knob {
  display: flex; flex-direction: column; align-items: center;
  touch-action: none; user-select: none; -webkit-user-select: none;
  cursor: ns-resize; border-radius: 14px; padding: 2px 0;
}
.knob svg { width: 64px; height: 64px; max-width: 100%; display: block; }
.klabel { font-size: 14px; font-weight: 600; margin-top: 2px; }
.kval { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  footer { color: #777; font-size: 12px; margin: 16px 0 0; }
</style>
</head>
<body>
<h1>SH-101 emulator</h1>
<div class="row">
  <button id="start" type="button">Start sound</button>
  <select id="patch"><option value="bass">Bass</option><option value="pwm">PWM lead</option><option value="whistle">Resonant whistle</option></select>
  <button id="keysToggle" type="button">Hide keys</button>
  <select id="midi"><option value="">MIDI: none</option></select>
</div>
<div id="status">Tap "Start sound" first. Sound needs a tap on most phones.</div>
<div id="debug"></div>

<div id="keys"></div>

<div id="panels"></div>
<footer>Built from docs/sh101_core.js by tools/build_index.js. Edit the core or the template, then rebuild.</footer>

<script>
/* SH-101 emulator core (JavaScript port of sh101_engine.py). Same models and guesses (G36-G44).
   Works in a browser AudioWorklet and in Node for testing. No DOM access. */
(function (root) {
  const A4 = 442.0;
  const K4 = 0.435, FC0 = 250.0, VC = 0.019, PIN9 = 0.1110;
  const KYB = VC / PIN9;                       // exact 1 oct/oct keyboard tracking (VR-8 calibration)
  const CUT_MIN = 0.589, CUT_MAX = -1.288;     // slider: 10 Hz (bottom) .. 20 kHz (top), spec
  const MIX = { saw: 1.0, pulse: 0.69, sub: 0.57, noise: 0.3 };   // G39, G38

  const kcv = (m) => 0.417 + (m - 53) / 12.0;  // service manual: F3 = 0.417 V, 1 V/oct
  function bus(p) { return CUT_MIN + p * (CUT_MAX - CUT_MIN); }
  function cutoffHz(midi, p, follow) {
    const f = follow === undefined ? 1 : follow;               // Key Follow knob, 0..1 (Roland spec)
    const v9 = PIN9 * (bus(p) - f * KYB * (kcv(midi) - kcv(60)));
    return K4 * FC0 * Math.pow(2, -v9 / VC);
  }
  // Seeded PRNG (mulberry32). Gives repeatable noise, so renders are identical run to run.
  // The seed is fixed (DEFAULT.seed) and not exposed on the panel yet.
  function makeRng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;   // [0, 1)
    };
  }
  function noteHz(midi, rangeOct, cents) { return A4 * Math.pow(2, (midi - 69) / 12) * Math.pow(2, rangeOct) * Math.pow(2, (cents || 0) / 1200); }

  function blep(t, dt) {
    if (t < dt) { const x = t / dt; return 2 * x - x * x - 1; }
    if (t > 1 - dt) { const x = (t - 1) / dt; return x * x + 2 * x + 1; }
    return 0;
  }

  class Env {                                  // G36, G37: linear attack, exponential decay and release
    constructor(fs, a, d, s, r) {
      this.fs = fs; this.a = Math.max(a, 1e-4); this.s = s;
      this.cd = Math.exp(-1 / (fs * Math.max(d / 3, 1e-4)));
      this.cr = Math.exp(-1 / (fs * Math.max(r / 3, 1e-4)));
      this.stage = 0; this.level = 0;          // 0 idle, 1 attack, 2 decay, 3 sustain, 4 release
    }
    setParams(a, d, s, r) {                 // change times/levels without resetting the current note
      this.a = Math.max(a, 1e-4); this.s = s;
      this.cd = Math.exp(-1 / (this.fs * Math.max(d / 3, 1e-4)));
      this.cr = Math.exp(-1 / (this.fs * Math.max(r / 3, 1e-4)));
    }
    on() { this.stage = 1; }
    off() { if (this.stage !== 0) this.stage = 4; }
    next() {
      if (this.stage === 1) { this.level += 1 / (this.fs * this.a); if (this.level >= 1) { this.level = 1; this.stage = 2; } }
      else if (this.stage === 2) { this.level = this.s + (this.level - this.s) * this.cd; if (this.level - this.s < 1e-4) { this.level = this.s; this.stage = 3; } }
      else if (this.stage === 3) { this.level = this.s; }
      else if (this.stage === 4) { this.level *= this.cr; if (this.level < 1e-5) { this.level = 0; this.stage = 0; } }
      return this.level;
    }
  }

  const DEFAULT = { rangeOct: 0, attack: 0.005, decay: 0.25, sustain: 0.35, release: 0.2,
    attackPwm: 0.01, decayPwm: 0.2, pw: 0.5, pwmAmt: 0.25,
    wSaw: 1, wPulse: 0, wSub: 0, wNoise: 0, cutoff: 0.5, res: 0.4, envAmt: 0.6,
    lfoRate: 5.0, lfoCut: 0, vibMax: 0, vcaGate: false, volume: 0.8,
    legato: false, portaTime: 0, transpose: 0, arpMode: "off", arpBpm: 120,
    // switches (G50-G54)
    lfoWave: "triangle",    // "square" | "triangle" | "noise" | "random"
    vcoWave: "both",        // not a Roland switch: the source mixer levels control saw and pulse (G51 corrected)
    subOct: "1",            // "1" = square 1 oct down, "2" = square 2 oct down, "2p" = pulse 2 oct down (panel, G62)
    vcaMode: "ENV",         // "ENV" | "GATE"
    envTrig: "gate",        // "gate" | "gatetrig" | "lfo"
    pwmSrc: "env",          // PWM source: "env" | "lfo" | "man" (panel switch LFO / MAN / ENV, G56)
    portaMode: "auto",      // portamento: "auto" | "off" | "on" (panel AUTO / OFF / ON, G57)
    keyFollow: 1,           // KYBD / Key Follow slider, 0..1
    tuneCents: 0,           // TUNE knob, +-50 cents
    vcoBend: 1,             // Bend VCO slider: 1 = +-2 semitones at full lever
    vcfBend: 0,             // Bend VCF slider: 1 = +-1 octave at full lever (G69)
    seed: 101 };            // noise seed (fixed for now; not on the panel)

  class Voice {
    constructor(fs, patch) {
      this.fs = fs; this.p = Object.assign({}, DEFAULT, patch || {});
      this.stack = []; this.physical = new Set(); this.hold = false;
      this.midi = null; this.mod = 0; this.resCC = null; this.cutCC = null;
      this.ph = 0; this.phSub = 0; this.phLfo = 0; this.lfoHold = 0; this.bendNorm = 0;
      this.pwmEnv = new Env(fs, this.p.attackPwm, this.p.decayPwm, 0, this.p.release);
      this.ampEnv = new Env(fs, this.p.attack, this.p.decay, this.p.sustain, this.p.release);
      this.y = [0, 0, 0, 0]; this.baseCut = 0;
      this.pitch = null; this.target = null; this.glideAllowed = false;
      this.arpIdx = 0; this.arpDir = 1; this.arpCount = 0; this.arpGateAt = 0; this.arpFirst = false;
      this.rand = makeRng(this.p.seed);
    }
    rebuildEnvs() {
      this.pwmEnv = new Env(this.fs, this.p.attackPwm, this.p.decayPwm, 0, this.p.release);
      this.ampEnv = new Env(this.fs, this.p.attack, this.p.decay, this.p.sustain, this.p.release);
    }
    setPatch(patch) {
      this.p = Object.assign({}, this.p, patch);
      const p = this.p;
      this.pwmEnv.setParams(p.attackPwm, p.decayPwm, 0, p.release);
      this.ampEnv.setParams(p.attack, p.decay, p.sustain, p.release);
      if (this.midi !== null) this.play(this.midi, false);
    }
    arpSteps() { return Math.max(1, Math.round(this.fs * 60 / this.p.arpBpm / 4)); }
    play(midi, retrigger) {
      const eff = midi + this.p.transpose;
      this.midi = midi; this.target = eff;
      if (this.pitch === null) this.pitch = eff;
      const pos = this.cutCC !== null ? this.cutCC : this.p.cutoff;
      this.baseCut = cutoffHz(eff, pos, this.p.keyFollow);
      if (retrigger && this.p.envTrig !== "lfo") { this.ampEnv.on(); this.pwmEnv.on(); }
    }
    noteOn(midi) {
      this.physical.add(midi);
      const i = this.stack.indexOf(midi); if (i >= 0) this.stack.splice(i, 1);
      const hadNotes = this.stack.length > 0;
      this.stack.push(midi);
      if (this.p.arpMode !== "off") {
        if (!hadNotes) { this.arpCount = this.arpSteps(); this.arpFirst = true; }
        return;
      }
      const retrig = this.p.envTrig === "gatetrig" ? true : !(this.p.legato && hadNotes);
      // portamento: ON glides every note; AUTO glides only when a key is played while others are held; OFF never
      this.glideAllowed = this.p.portaMode === "on" || (this.p.portaMode === "auto" && hadNotes);
      this.play(midi, retrig);
    }
    noteOff(midi) {
      this.physical.delete(midi);
      if (this.hold) return;                                // hold keeps the notes sounding
      this.release(midi);
    }
    release(midi) {
      const i = this.stack.indexOf(midi); if (i >= 0) this.stack.splice(i, 1);
      if (this.stack.length === 0) {
        if (this.p.envTrig !== "lfo") { this.ampEnv.off(); this.pwmEnv.off(); }
        this.arpCount = 0; return;
      }
      if (this.p.arpMode === "off" && midi === this.midi) this.play(this.stack[this.stack.length - 1], false);
    }
    setHold(on) {
      this.hold = !!on;
      if (!this.hold) {                                     // releasing hold lets go of keys that are no longer down
        const keep = this.stack.filter(m => this.physical.has(m));
        const dropped = this.stack.filter(m => !this.physical.has(m));
        this.stack = keep;
        if (this.stack.length === 0) { if (this.p.envTrig !== "lfo") { this.ampEnv.off(); this.pwmEnv.off(); } this.arpCount = 0; }
        else if (dropped.length && this.p.arpMode === "off" && this.midi !== null && !keep.includes(this.midi)) this.play(keep[keep.length - 1], false);
      }
    }
    control(cc, value) {
      const v = value / 127;
      if (cc === 1) this.mod = v;
      else if (cc === 71) this.resCC = v;
      else if (cc === 74) { this.cutCC = v; if (this.midi !== null) this.play(this.midi, false); }
    }
    pitchBend(value) { this.bendNorm = Math.max(-1, Math.min(1, value / 8192)); }

    arpAdvance() {
      const notes = this.stack.slice().sort((a, b) => a - b);
      const n = notes.length, mode = this.p.arpMode;
      if (this.arpFirst) { this.arpFirst = false; this.arpDir = 1; this.arpIdx = mode === "down" ? n - 1 : 0; }
      else if (mode === "up") this.arpIdx = (this.arpIdx + 1) % n;
      else if (mode === "down") this.arpIdx = (this.arpIdx - 1 + n) % n;
      else {
        if (n > 1) {
          this.arpIdx += this.arpDir;
          if (this.arpIdx >= n - 1) { this.arpIdx = n - 1; this.arpDir = -1; }
          if (this.arpIdx <= 0) { this.arpIdx = 0; this.arpDir = 1; }
        } else this.arpIdx = 0;
      }
      if (this.arpIdx >= n) this.arpIdx = 0;
      this.play(notes[this.arpIdx], true);
    }

    render(out, n) {
      const p = this.p, fs = this.fs;
      if (this.stack.length === 0 && this.ampEnv.stage === 0) { for (let i = 0; i < n; i++) out[i] = 0; return; }
      if (this.midi === null && this.stack.length === 0) { for (let i = 0; i < n; i++) out[i] = 0; return; }
      const res = this.resCC !== null ? this.resCC : p.res;
      const k = Math.min(4.2 * res / 0.785, 5.0);
      const vib = this.mod * p.vibMax;
      const gateOn = this.stack.length > 0 ? 1 : 0;
      const glideCoef = p.portaTime > 0 ? 1 - Math.exp(-1 / (fs * Math.max(p.portaTime / 3, 1e-4))) : 1;
      const arpOn = p.arpMode !== "off" && this.stack.length > 0;
      const stepLen = this.arpSteps();
      const sawOn = p.vcoWave !== "pulse" ? 1 : 0, pulseOn = p.vcoWave !== "saw" ? 1 : 0;
      const subDiv = (p.subOct === "2" || p.subOct === "2p") ? 4 : 2, subOn = 1;
      const subPulse = p.subOct === "2p";
      const gateMode = p.vcaMode === "GATE" || p.vcaGate;
      for (let i = 0; i < n; i++) {
        if (arpOn) {
          this.arpCount++;
          if (this.arpCount >= stepLen) { this.arpCount = 0; this.arpGateAt = Math.round(stepLen * 0.6); this.arpAdvance(); }
          if (this.arpCount === this.arpGateAt) { this.ampEnv.off(); this.pwmEnv.off(); }
        }
        if (this.pitch !== null && this.target !== null) {
          if (this.glideAllowed && p.portaTime > 0) this.pitch += (this.target - this.pitch) * glideCoef;
          else this.pitch = this.target;
        }
        const ph0 = this.phLfo;
        this.phLfo = (ph0 + p.lfoRate / fs) % 1;
        const wrapped = this.phLfo < ph0;
        if (wrapped) this.lfoHold = this.rand() * 2 - 1;      // random: new level each LFO cycle
        if (wrapped && p.envTrig === "lfo") { this.ampEnv.on(); this.pwmEnv.on(); }
        let lfo;
        if (p.lfoWave === "square") lfo = this.phLfo < 0.5 ? 1 : -1;
        else if (p.lfoWave === "noise") lfo = this.rand() * 2 - 1;
        else if (p.lfoWave === "random") lfo = this.lfoHold;
        else lfo = 2 * Math.abs(2 * this.phLfo - 1) - 1;        // triangle (G43)
        const envPwm = this.pwmEnv.next();
        const env = this.ampEnv.next();
        const f = noteHz(this.pitch === null ? 69 : this.pitch, p.rangeOct, p.tuneCents) * Math.pow(2, (vib * lfo + 2 * this.bendNorm * p.vcoBend) / 12);
        const dt = f / fs;
        this.ph = (this.ph + dt) % 1; const t = this.ph;
        this.phSub = (this.phSub + dt / subDiv) % 1; const ts = this.phSub;
        const pwmMod = p.pwmSrc === "env" ? envPwm : p.pwmSrc === "lfo" ? lfo : 0;   // MAN = no modulation
        const duty = Math.min(0.98, Math.max(0.02, 0.5 * p.pw + p.pwmAmt * pwmMod));
        const saw = 2 * t - 1 - blep(t, dt);
        const pulse = (t < duty ? 1 : -1) - blep(t, dt) + blep((t - duty + 1) % 1, dt);
        const subDuty = subPulse ? 0.25 : 0.5;                 // G62: pulse sub taken as 25% width
        const sub = (ts < subDuty ? 1 : -1) - blep(ts, dt / subDiv) + blep((ts - subDuty + 1) % 1, dt / subDiv);
        const noise = this.rand() * 2 - 1;
        const src = sawOn * p.wSaw * MIX.saw * saw + pulseOn * p.wPulse * MIX.pulse * pulse
                  + subOn * p.wSub * MIX.sub * sub + p.wNoise * MIX.noise * noise;
        const cut = this.baseCut * Math.pow(2, p.envAmt * 4.0 * env + p.lfoCut * lfo + this.bendNorm * p.vcfBend);
        const g = 1 - Math.exp(-2 * Math.PI * Math.min(Math.max(cut, 20), fs * 0.45) / fs);
        const x = src * 0.5;
        const y = this.y;
        const u = Math.tanh(x - k * y[3]);
        y[0] += g * (u - y[0]);
        y[1] += g * (Math.tanh(y[0]) - y[1]);
        y[2] += g * (Math.tanh(y[1]) - y[2]);
        y[3] += g * (Math.tanh(y[2]) - y[3]);
        const gain = gateMode ? gateOn : env;                   // G44 / VCA switch
        out[i] = y[3] * gain * p.volume;
      }
    }
  }

  const PATCHES = {
    bass: { cutoff: 0.71, res: 0.45, envAmt: 0.7, wSaw: 1, wSub: 0.4, decay: 0.3, sustain: 0.2, vibMax: 0.02 },
    pwm: { wSaw: 0, wPulse: 1, pw: 0.4, pwmAmt: 0.35, cutoff: 0.55, res: 0.35, envAmt: 0.3,
           lfoRate: 5.5, vibMax: 0.02, attack: 0.2, decay: 0.6, sustain: 0.6, release: 0.4 },
    whistle: { wSaw: 0.05, cutoff: 0.61, res: 0.9, envAmt: 0, lfoCut: 0.08, lfoRate: 4.0,
               attack: 0.02, decay: 0.4, sustain: 0.6, release: 0.3, vcaGate: true },
  };

  const api = { Voice, Env, cutoffHz, noteHz, kcv, PATCHES, DEFAULT, MIX };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.SH101 = api;
})(typeof globalThis !== "undefined" ? globalThis : (typeof self !== "undefined" ? self : this));
</script>

<script>
// AcidBox knob: a rotary dial that reads and writes one setting.
//
// Needs these from the surrounding app:
//   state.params           object holding each setting's current value (0 to 1), keyed by id
//   setParam(id, value)    stores the new value and sends it to the sound engine
//
// Usage:
//   document.body.appendChild(buildKnob({ id: 'cutoff', label: 'Cutoff', def: 0.35 }));
//   buildKnob({ id, label, def, fmt })
//     id     the setting this knob controls
//     label  text shown under the dial
//     def    default value (0 to 1), used for double-click or double-tap reset
//     fmt    optional: turns a 0..1 value into display text, e.g. v => Math.round(v * 100) + '%'

const A0 = Math.PI * 0.75, SPAN = Math.PI * 1.5;   // dial runs from 7:30 to 4:30, 270 degrees

function arc(r, a0, a1) {
  const x0 = 32 + r * Math.cos(a0), y0 = 32 + r * Math.sin(a0);
  const x1 = 32 + r * Math.cos(a1), y1 = 32 + r * Math.sin(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

const clamp = v => Math.min(1, Math.max(0, v));
const knobDraw = {};   // redraws every knob bound to a setting, by setting id

function buildKnob(k) {
  const el = document.createElement('div');
  el.className = 'knob';
  el.dataset.pid = k.id;
  el.tabIndex = 0;
  el.setAttribute('role', 'slider');
  el.setAttribute('aria-label', k.label);
  el.setAttribute('aria-valuemin', '0');
  el.setAttribute('aria-valuemax', '100');
  el.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="${arc(28, A0, A0 + SPAN)}" fill="none" stroke="var(--track)" stroke-width="4" stroke-linecap="round"/>
      <path class="val" fill="none" stroke="var(--led)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="21" fill="var(--knob-body)"/>
      <line class="ind" x1="32" y1="32" stroke="var(--knob-mark)" stroke-width="3.5" stroke-linecap="round"/>
    </svg><span class="klabel">${k.label}</span><span class="kval"></span>`;

  const valPath = el.querySelector('.val'), ind = el.querySelector('.ind'), out = el.querySelector('.kval');
  const fmt = k.fmt || (v => Math.round(v * 100));

  function draw() {
    const v = state.params[k.id], a = A0 + v * SPAN;
    valPath.setAttribute('d', v > 0.004 ? arc(28, A0, a) : '');   // the filled part of the ring
    ind.setAttribute('x2', (32 + 16 * Math.cos(a)).toFixed(2));  // the pointer
    ind.setAttribute('y2', (32 + 16 * Math.sin(a)).toFixed(2));
    out.textContent = fmt(v);
    el.setAttribute('aria-valuenow', Math.round(v * 100));
    el.setAttribute('aria-valuetext', String(fmt(v)));
  }

  function set(v) { setParam(k.id, clamp(v)); knobDraw[k.id](); }

  // drag up or down to change; hold Shift for fine control
  let startY = 0, startV = 0, dragging = false, pendingV = null;
  el.addEventListener('pointerdown', e => {
    dragging = true; startY = e.clientY; startV = state.params[k.id];
    el.setPointerCapture(e.pointerId); e.preventDefault();
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    const v = startV + (startY - e.clientY) / (e.shiftKey ? 700 : 180);
    // phones can fire 120+ moves a second; apply at most one per screen frame
    if (pendingV === null) requestAnimationFrame(() => { const x = pendingV; pendingV = null; set(x); });
    pendingV = v;
  });
  const end = () => { dragging = false; };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);

  // double-click or double-tap resets to the default
  el.addEventListener('dblclick', () => set(k.def));
  let lastTap = 0;
  el.addEventListener('pointerup', e => {
    if (e.pointerType !== 'touch') return;
    const now = Date.now();
    if (now - lastTap < 300 && Math.abs(e.clientY - startY) < 6) set(k.def);
    lastTap = now;
  });

  // keyboard: arrows nudge, PageUp/PageDown jump, Home and End go to the ends
  el.addEventListener('keydown', e => {
    const v = state.params[k.id];
    const steps = { ArrowUp: 0.01, ArrowRight: 0.01, ArrowDown: -0.01, ArrowLeft: -0.01, PageUp: 0.1, PageDown: -0.1 };
    if (e.key in steps) { set(v + steps[e.key]); e.preventDefault(); }
    else if (e.key === 'Home') { set(0); e.preventDefault(); }
    else if (e.key === 'End') { set(1); e.preventDefault(); }
  });

  draw();
  // several knobs can share one setting, so keep them all in step
  const prev = knobDraw[k.id];
  knobDraw[k.id] = prev ? () => { prev(); draw(); } : draw;
  return el;
}
</script>

<script>
(function () {
  "use strict";
  const SH = window.SH101;
  const $ = s => document.querySelector(s);
  const statusEl = $("#status"), dbg = $("#debug");
  const say = (t, warn) => { statusEl.textContent = t; statusEl.className = warn ? "warn" : ""; };
  if (!SH) { say("The sound core did not load.", true); return; }

  let ctx = null, node = null, holdOn = false;

  // ---------- mappings: slider position 0..1 <-> patch value ----------
  const clamp01 = v => Math.min(1, Math.max(0, v));
  const tmap = (pos, lo, hi) => lo * Math.pow(hi / lo, pos);            // G36: exponential over the spec range
  const tinv = (t, lo, hi) => clamp01(Math.log(t / lo) / Math.log(hi / lo));
  const TIME = (lo, hi) => ({ to: v => tmap(v, lo, hi), from: p => tinv(p, lo, hi) });
  const LIN = { to: v => v, from: p => clamp01(p) };
  const fmtPct = p => Math.round(p * 100) + "%";
  const fmtSec = p => p < 1 ? Math.round(p * 1000) + " ms" : p.toFixed(2) + " s";

  // Panel layout follows the panel photo and guess_ledger.md ("Layout follows the panel photo").
  // kind: "patch" (goes to the core patch), "pwm" (the one PWM fader, G58), "mod" (mod lever, CC1), "bend" (spring-back lever).
  const SECTIONS = [
    { title: "Tune", items: [
      { t: "slider", kind: "patch", id: "tune", key: "tuneCents", label: "Tune",
        map: { to: v => (v - 0.5) * 100, from: p => clamp01(p / 100 + 0.5) }, fmt: p => Math.round(p) + " ct" },
    ]},
    { title: "Arpeggio", items: [
      { t: "group", key: "arpMode", label: "Arp", values: ["off", "up", "updown", "down"], labels: ["Off", "Up", "U&D", "Down"] },
      { t: "slider", kind: "patch", id: "arpBpm", key: "arpBpm", label: "Arp tempo",
        map: { to: v => 60 + 180 * v, from: p => clamp01((p - 60) / 180) }, fmt: p => Math.round(p) + " BPM" },
      { t: "row", items: [ { t: "toggle", key: "legato", label: "Legato" }, { t: "hold" } ] },
      { t: "group", key: "transpose", label: "Transpose", values: [0, 12, 24], labels: ["L", "M", "H"] },
    ]},
    { title: "Modulator", items: [
      { t: "slider", kind: "patch", id: "lfoRate", key: "lfoRate", label: "Rate",
        map: { to: v => 0.1 * Math.pow(300, v), from: p => clamp01(Math.log(p / 0.1) / Math.log(300)) },
        fmt: p => p.toFixed(2) + " Hz" },
      { t: "group", key: "lfoWave", label: "Wave", values: ["triangle", "square", "random", "noise"], labels: ["Tri", "Square", "Random", "Noise"] },
    ]},
    { title: "VCO", items: [
      { t: "row", cls: "hrow", items: [
        { t: "slider", kind: "patch", id: "vibMax", key: "vibMax", label: "MOD depth",
          map: { to: v => v * 0.1, from: p => clamp01(p / 0.1) }, fmt: p => p.toFixed(3) + " st" },
        { t: "group", key: "rangeOct", label: "Range", values: [-1, 0, 1, 2], labels: ["16'", "8'", "4'", "2'"], stack: true },
        { t: "slider", kind: "pwm", id: "pwm", label: "Pulse width", vertical: true },
        { t: "group", key: "pwmSrc", label: "PWM source", values: ["env", "lfo", "man"], labels: ["ENV", "LFO", "MAN"], stack: true },
      ] },
    ]},
    { title: "Source mixer", items: [
      { t: "slider", kind: "patch", id: "wPulse", key: "wPulse", label: "Pulse", map: LIN, fmt: fmtPct },
      { t: "slider", kind: "patch", id: "wSaw", key: "wSaw", label: "Saw", map: LIN, fmt: fmtPct },
      { t: "slider", kind: "patch", id: "wSub", key: "wSub", label: "Sub", map: LIN, fmt: fmtPct },
      { t: "group", key: "subOct", label: "Sub switch", values: ["1", "2", "2p"], labels: ["1 oct sq", "2 oct sq", "2 oct pulse"] },
      { t: "slider", kind: "patch", id: "wNoise", key: "wNoise", label: "Noise", map: LIN, fmt: fmtPct },
    ]},
    { title: "VCF", items: [
      { t: "slider", kind: "patch", id: "cutoff", key: "cutoff", label: "Freq", map: LIN,
        fmt: p => Math.round(SH.cutoffHz(60, p)) + " Hz at C4" },
      { t: "slider", kind: "patch", id: "res", key: "res", label: "Resonance", map: LIN, fmt: fmtPct },
      { t: "slider", kind: "patch", id: "envAmt", key: "envAmt", label: "ENV", map: LIN, fmt: fmtPct },
      { t: "slider", kind: "patch", id: "lfoCut", key: "lfoCut", label: "MOD", map: LIN, fmt: fmtPct },
      { t: "slider", kind: "patch", id: "keyFollow", key: "keyFollow", label: "KYBD", map: LIN, fmt: fmtPct },
    ]},
    { title: "VCA", items: [
      { t: "group", key: "vcaMode", label: "VCA", values: ["ENV", "GATE"], labels: ["ENV", "GATE"] },
    ]},
    { title: "Envelope", items: [
      { t: "group", key: "envTrig", label: "Trigger", values: ["gate", "gatetrig", "lfo"], labels: ["Gate", "Gate+Trig", "LFO"] },
      { t: "slider", kind: "patch", id: "attack", key: "attack", label: "Attack", map: TIME(0.0015, 4), fmt: fmtSec },
      { t: "slider", kind: "patch", id: "decay", key: "decay", label: "Decay", map: TIME(0.002, 10), fmt: fmtSec },
      { t: "slider", kind: "patch", id: "sustain", key: "sustain", label: "Sustain", map: LIN, fmt: fmtPct },
      { t: "slider", kind: "patch", id: "release", key: "release", label: "Release", map: TIME(0.002, 10), fmt: fmtSec },
    ]},
    { title: "Controller", items: [
      { t: "slider", kind: "patch", id: "volume", key: "volume", label: "Volume", map: LIN, fmt: fmtPct },
      { t: "slider", kind: "patch", id: "portaTime", key: "portaTime", label: "Portamento",
        map: { to: v => v * 5, from: p => clamp01(p / 5) }, fmt: fmtSec },
      { t: "group", key: "portaMode", label: "Portamento mode", values: ["auto", "off", "on"], labels: ["Auto", "Off", "On"] },
      { t: "slider", kind: "patch", id: "vcoBend", key: "vcoBend", label: "VCO bend", map: LIN, fmt: fmtPct },
      { t: "slider", kind: "patch", id: "vcfBend", key: "vcfBend", label: "VCF bend", map: LIN, fmt: fmtPct },
      { t: "slider", kind: "mod", id: "lfoMod", label: "LFO MOD" },
      { t: "slider", kind: "bend", id: "bender", label: "Bender", min: -1, max: 1 },
    ]},
  ];

  // ---------- state: the patch sent to the core, and the one PWM fader ----------
  const S = {};            // full patch, kept in sync with the controls
  let pwBase = 0.5;        // hidden base pulse width (core's pw); not on the panel
  let pwFader = 0;         // the single PWM fader (G58)
  const ctrl = {}, groups = {}, toggles = {};

  // Pulse width (G58): MAN sets the width; ENV and LFO use the fader as depth on the hidden base width.
  function withPwm() {
    if (S.pwmSrc === "man") S.pw = pwFader;
    else { S.pw = pwBase; S.pwmAmt = pwFader * 0.5; }
    return S;
  }
  function pwmText() {
    return (S.pwmSrc === "man" ? "duty " : "depth ") + Math.round(pwFader * 50) + "%";
  }
  function postMsg(m) { if (node) node.port.postMessage(m); }
  function send() { withPwm(); postMsg({ type: "patch", patch: S }); }

  // ---------- control building ----------
  // Continuous patch controls are knobs (ui/knob.js). It reads and writes state.params through setParam.
  // Sliders remain for the PWM fader, the mod lever, and the spring-back bender.
  const state = { params: {} };
  window.state = state;
  window.setParam = (id, v) => { state.params[id] = v; applyControl(id); };

  function applyControl(id) {
    const c = ctrl[id]; if (!c) return;
    const it = c.it, v = state.params[id];
    if (it.kind === "patch") { S[it.key] = it.map.to(v); send(); }
    else if (it.kind === "pwm") { pwFader = v; send(); }
    else if (it.kind === "mod") postMsg({ type: "cc", cc: 1, value: Math.round(v * 127) });
    else if (it.kind === "bend") postMsg({ type: "bend", value: Math.round(v * 8191) });
    refreshOut(id);
  }
  function refreshOut(id) {
    const c = ctrl[id]; if (!c || !c.out) return;     // knobs draw their own readout
    const it = c.it;
    if (it.kind === "pwm") c.out.textContent = pwmText();
    else if (it.kind === "mod") c.out.textContent = fmtPct(parseFloat(c.input.value));
    else if (it.kind === "bend") c.out.textContent = parseFloat(c.input.value).toFixed(2);
  }
  function syncAll() {
    for (const id in ctrl) {
      const c = ctrl[id], it = c.it;
      if (it.kind === "patch") {
        state.params[id] = it.map.from(S[it.key]);
        if (knobDraw[id]) knobDraw[id]();
      } else if (it.kind === "pwm") {
        c.input.value = pwFader;
      }
      refreshOut(id);
    }
    for (const key in groups) {
      const g = groups[key];
      g.btns.forEach((b, i) => b.classList.toggle("on", g.values[i] === S[key]));
    }
    for (const key in toggles) toggles[key].classList.toggle("on", !!S[key]);
  }
  function makeKnob(it) {
    const def = it.map.from(SH.DEFAULT[it.key]);
    state.params[it.id] = it.map.from(S[it.key] ?? SH.DEFAULT[it.key]);
    ctrl[it.id] = { it, input: null, out: null };
    return buildKnob({ id: it.id, label: it.label, def, fmt: v => it.fmt(it.map.to(v)) });
  }
  function makeSlider(it) {
    const row = document.createElement("div");
    if (it.vertical) {
      row.className = "vsl";
      row.innerHTML = `<label for="c-${it.id}">${it.label}</label><div class="vbox">` +
        `<input type="range" id="c-${it.id}" min="0" max="1" step="0.001"></div><output></output>`;
    } else {
      row.className = "sl";
      row.innerHTML = `<label for="c-${it.id}">${it.label}</label>` +
        `<input type="range" id="c-${it.id}" min="${it.min ?? 0}" max="${it.max ?? 1}" step="0.001">` +
        `<output></output>`;
    }
    const input = row.querySelector("input"), out = row.querySelector("output");
    const c = { it, input, out };
    ctrl[it.id] = c;
    state.params[it.id] = it.kind === "pwm" ? pwFader : 0;
    input.addEventListener("input", () => { state.params[it.id] = parseFloat(input.value); applyControl(it.id); });
    if (it.kind === "bend") {                                   // the lever springs back to centre
      const back = () => { input.value = 0; state.params[it.id] = 0; applyControl(it.id); };
      ["pointerup", "pointercancel", "touchend", "mouseup"].forEach(ev => input.addEventListener(ev, back));
    }
    return row;
  }
  function makeGroup(it) {
    const wrap = document.createElement("div"); wrap.className = "grp" + (it.stack ? " stackgrp" : "");
    wrap.innerHTML = `<div class="cap">${it.label}</div><div class="seg${it.stack ? " stack" : ""}"></div>`;
    const seg = wrap.querySelector(".seg");
    const btns = it.values.map((val, i) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = it.labels[i];
      b.addEventListener("click", () => { S[it.key] = val; syncAll(); send(); });
      seg.appendChild(b);
      return b;
    });
    groups[it.key] = { values: it.values, btns };
    return wrap;
  }
  function makeHold() {
    const wrap = document.createElement("div"); wrap.className = "grp";
    const b = document.createElement("button"); b.type = "button"; b.id = "hold";
    b.textContent = "Hold"; b.title = "Keep notes sounding after release";
    b.addEventListener("click", () => setHold(!holdOn));
    wrap.appendChild(b);
    return wrap;
  }
  function makeToggle(it) {
    const wrap = document.createElement("div"); wrap.className = "grp";
    const b = document.createElement("button"); b.type = "button"; b.textContent = it.label;
    b.addEventListener("click", () => { S[it.key] = !S[it.key]; syncAll(); send(); });
    wrap.appendChild(b);
    toggles[it.key] = b;
    return wrap;
  }
  function buildItem(it) {
    if (it.t === "slider") return it.kind === "patch" ? makeKnob(it) : makeSlider(it);
    if (it.t === "group") return makeGroup(it);
    if (it.t === "hold") return makeHold();
    return makeToggle(it);
  }
  function buildPanels() {
    const root = $("#panels");
    for (const sec of SECTIONS) {
      const box = document.createElement("section"); box.className = "panel";
      box.innerHTML = `<h2>${sec.title}</h2>`;
      let knobRow = null;
      for (const it of sec.items) {
        if (it.t === "slider" && it.kind === "patch") {
          if (!knobRow) { knobRow = document.createElement("div"); knobRow.className = "knobs"; box.appendChild(knobRow); }
          knobRow.appendChild(makeKnob(it));
          continue;
        }
        knobRow = null;
        if (it.t === "row") {
          const r = document.createElement("div"); r.className = it.cls || "inline";
          for (const sub of it.items) r.appendChild(buildItem(sub));
          box.appendChild(r);
        } else {
          box.appendChild(buildItem(it));
        }
      }
      root.appendChild(box);
    }
  }

  // ---------- presets ----------
  function loadPreset(name) {
    Object.assign(S, SH.DEFAULT, SH.PATCHES[name]);
    if (S.vcaGate) S.vcaMode = "GATE";          // the whistle preset gates the VCA
    pwBase = S.pw;
    pwFader = S.pwmSrc === "man" ? S.pw : clamp01(S.pwmAmt * 2);
    syncAll();
    send();
  }

  // ---------- on-screen keyboard: C3 (48) to C5 (72) ----------
  const keysEl = $("#keys");
  const LOW = 48, HIGH = 72;
  const isBlack = m => [1, 3, 6, 8, 10].includes(m % 12);
  const whites = []; for (let m = LOW; m <= HIGH; m++) if (!isBlack(m)) whites.push(m);
  const wWidth = 100 / whites.length;
  const keyEls = {};
  whites.forEach((m, i) => {
    const d = document.createElement("div"); d.className = "wk";
    d.style.left = (i * wWidth) + "%"; d.style.width = (wWidth - 0.2) + "%";
    d.dataset.m = m; keysEl.appendChild(d); keyEls[m] = d;
    if (m % 12 === 0) { const l = document.createElement("div"); l.className = "lbl"; l.textContent = "C" + (Math.floor(m / 12) - 1); d.appendChild(l); }
  });
  for (let m = LOW; m <= HIGH; m++) if (isBlack(m)) {
    const prevWhite = whites.indexOf(m - 1);
    const d = document.createElement("div"); d.className = "bk";
    d.style.left = ((prevWhite + 1) * wWidth - wWidth * 0.3) + "%"; d.style.width = (wWidth * 0.6) + "%";
    d.dataset.m = m; keysEl.appendChild(d); keyEls[m] = d;
  }
  function noteOn(m) { if (!node) return; postMsg({ type: "on", note: m }); if (keyEls[m]) keyEls[m].classList.add("on-k"); }
  function noteOff(m) { if (!node) return; postMsg({ type: "off", note: m }); if (keyEls[m]) keyEls[m].classList.remove("on-k"); }
  // Each finger holds its own key, so several keys can sound at once (arpeggio and legato need this).
  const fingers = new Map();
  const keyAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.dataset && el.dataset.m ? parseInt(el.dataset.m, 10) : null; };
  keysEl.addEventListener("pointerdown", e => {
    const m = keyAt(e.clientX, e.clientY); if (m === null) return;
    e.preventDefault(); keysEl.setPointerCapture(e.pointerId);
    fingers.set(e.pointerId, m); noteOn(m);
  });
  keysEl.addEventListener("pointermove", e => {
    if (!fingers.has(e.pointerId)) return;
    const m = keyAt(e.clientX, e.clientY), old = fingers.get(e.pointerId);
    if (m !== null && m !== old) { noteOff(old); fingers.set(e.pointerId, m); noteOn(m); }
  });
  const fingerUp = e => {
    if (!fingers.has(e.pointerId)) return;
    noteOff(fingers.get(e.pointerId)); fingers.delete(e.pointerId);
  };
  keysEl.addEventListener("pointerup", fingerUp);
  keysEl.addEventListener("pointercancel", fingerUp);
  $("#keysToggle").addEventListener("click", () => {
    const folded = keysEl.classList.toggle("folded");
    $("#keysToggle").textContent = folded ? "Show keys" : "Hide keys";
  });

  // ---------- hold ----------
  function setHold(on) {
    holdOn = !!on;
    $("#hold").classList.toggle("on", holdOn);
    postMsg({ type: "hold", on: holdOn });
  }

  // ---------- audio ----------
  const WORKLET = `
    __CORE_SLOT__
    class SH101Processor extends AudioWorkletProcessor {
      constructor() {
        super();
        this.v = new SH101.Voice(sampleRate, {});
        this.buf = new Float32Array(128);
        this.port.onmessage = (e) => {
          const m = e.data;
          if (m.type === "on") this.v.noteOn(m.note);
          else if (m.type === "off") this.v.noteOff(m.note);
          else if (m.type === "cc") this.v.control(m.cc, m.value);
          else if (m.type === "bend") this.v.pitchBend(m.value);
          else if (m.type === "hold") this.v.setHold(m.on);
          else if (m.type === "patch") this.v.setPatch(m.patch);
        };
      }
      process(inputs, outputs) {
        const out = outputs[0][0];
        if (this.buf.length !== out.length) this.buf = new Float32Array(out.length);
        this.v.render(this.buf, out.length);
        out.set(this.buf);
        return true;
      }
    }
    registerProcessor("sh101", SH101Processor);
  `;
  async function startAudio() {
    if (ctx) { await ctx.resume(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const coreText = document.getElementById("core-src").textContent;
    const code = WORKLET.replace("__CORE_SLOT__", () => coreText);
    const url = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, "sh101", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [1] });
    node.connect(ctx.destination);
    await ctx.resume();
    send();
    postMsg({ type: "hold", on: holdOn });
    say("Sound on. Play the keys, or connect a MIDI keyboard.");
    dbg.textContent = "Audio: on (" + Math.round(ctx.sampleRate) + " Hz)";
    $("#start").classList.add("on");
  }
  $("#start").addEventListener("click", () => startAudio().catch(err => say("Audio failed: " + err, true)));

  // ---------- Web MIDI ----------
  const midiSel = $("#midi");
  let midiAccess = null, inputs = [];
  function onMidi(e) {
    const [st, d1, d2] = e.data; const kind = st & 0xf0;
    dbg.textContent = "MIDI in: status " + st.toString(16) + " data " + d1 + " " + (d2 === undefined ? "" : d2) +
      (node ? "" : "  (audio is OFF: tap Start sound)");
    if (!node) { say("MIDI is arriving, but audio is off. Tap Start sound.", true); return; }
    if (kind === 0x90 && d2 > 0) postMsg({ type: "on", note: d1 });
    else if (kind === 0x80 || (kind === 0x90 && d2 === 0)) postMsg({ type: "off", note: d1 });
    else if (kind === 0xb0) {
      if (d1 === 64) setHold(d2 >= 64);                          // sustain pedal drives Hold
      else postMsg({ type: "cc", cc: d1, value: d2 });
    }
    else if (kind === 0xe0) postMsg({ type: "bend", value: ((d2 << 7) | d1) - 8192 });
  }
  // Listen on every MIDI input at once. Keyboards often expose several ports, and only one may carry notes.
  function refreshInputs() {
    midiSel.innerHTML = '<option value="">MIDI: none</option>';
    inputs = [];
    midiAccess.inputs.forEach(inp => {
      inputs.push(inp);
      inp.onmidimessage = onMidi;
      const o = document.createElement("option"); o.value = inp.id; o.textContent = inp.name; midiSel.appendChild(o);
    });
    if (inputs.length === 0) say("No MIDI keyboard found. Plug one in (USB or Bluetooth), then reconnect.");
    else say("Listening on " + inputs.length + " MIDI input(s): " + inputs.map(i => i.name).join(", "));
  }
  midiSel.addEventListener("change", () => {
    const inp = inputs.find(i => i.id === midiSel.value);
    if (inp) say("Listening on all inputs. Last selected: " + inp.name);
  });
  if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess({ sysex: false }).then(acc => {
      midiAccess = acc; refreshInputs(); acc.onstatechange = refreshInputs;
    }).catch(() => say("MIDI permission was refused.", true));
  } else {
    say("This browser has no Web MIDI (iPhone Safari does not). On-screen keys still work.", true);
  }

  // ---------- start ----------
  buildPanels();
  $("#patch").addEventListener("change", e => loadPreset(e.target.value));
  loadPreset("bass");
})();
</script>

<script type="text/plain" id="core-src">
/* SH-101 emulator core (JavaScript port of sh101_engine.py). Same models and guesses (G36-G44).
   Works in a browser AudioWorklet and in Node for testing. No DOM access. */
(function (root) {
  const A4 = 442.0;
  const K4 = 0.435, FC0 = 250.0, VC = 0.019, PIN9 = 0.1110;
  const KYB = VC / PIN9;                       // exact 1 oct/oct keyboard tracking (VR-8 calibration)
  const CUT_MIN = 0.589, CUT_MAX = -1.288;     // slider: 10 Hz (bottom) .. 20 kHz (top), spec
  const MIX = { saw: 1.0, pulse: 0.69, sub: 0.57, noise: 0.3 };   // G39, G38

  const kcv = (m) => 0.417 + (m - 53) / 12.0;  // service manual: F3 = 0.417 V, 1 V/oct
  function bus(p) { return CUT_MIN + p * (CUT_MAX - CUT_MIN); }
  function cutoffHz(midi, p, follow) {
    const f = follow === undefined ? 1 : follow;               // Key Follow knob, 0..1 (Roland spec)
    const v9 = PIN9 * (bus(p) - f * KYB * (kcv(midi) - kcv(60)));
    return K4 * FC0 * Math.pow(2, -v9 / VC);
  }
  // Seeded PRNG (mulberry32). Gives repeatable noise, so renders are identical run to run.
  // The seed is fixed (DEFAULT.seed) and not exposed on the panel yet.
  function makeRng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;   // [0, 1)
    };
  }
  function noteHz(midi, rangeOct, cents) { return A4 * Math.pow(2, (midi - 69) / 12) * Math.pow(2, rangeOct) * Math.pow(2, (cents || 0) / 1200); }

  function blep(t, dt) {
    if (t < dt) { const x = t / dt; return 2 * x - x * x - 1; }
    if (t > 1 - dt) { const x = (t - 1) / dt; return x * x + 2 * x + 1; }
    return 0;
  }

  class Env {                                  // G36, G37: linear attack, exponential decay and release
    constructor(fs, a, d, s, r) {
      this.fs = fs; this.a = Math.max(a, 1e-4); this.s = s;
      this.cd = Math.exp(-1 / (fs * Math.max(d / 3, 1e-4)));
      this.cr = Math.exp(-1 / (fs * Math.max(r / 3, 1e-4)));
      this.stage = 0; this.level = 0;          // 0 idle, 1 attack, 2 decay, 3 sustain, 4 release
    }
    setParams(a, d, s, r) {                 // change times/levels without resetting the current note
      this.a = Math.max(a, 1e-4); this.s = s;
      this.cd = Math.exp(-1 / (this.fs * Math.max(d / 3, 1e-4)));
      this.cr = Math.exp(-1 / (this.fs * Math.max(r / 3, 1e-4)));
    }
    on() { this.stage = 1; }
    off() { if (this.stage !== 0) this.stage = 4; }
    next() {
      if (this.stage === 1) { this.level += 1 / (this.fs * this.a); if (this.level >= 1) { this.level = 1; this.stage = 2; } }
      else if (this.stage === 2) { this.level = this.s + (this.level - this.s) * this.cd; if (this.level - this.s < 1e-4) { this.level = this.s; this.stage = 3; } }
      else if (this.stage === 3) { this.level = this.s; }
      else if (this.stage === 4) { this.level *= this.cr; if (this.level < 1e-5) { this.level = 0; this.stage = 0; } }
      return this.level;
    }
  }

  const DEFAULT = { rangeOct: 0, attack: 0.005, decay: 0.25, sustain: 0.35, release: 0.2,
    attackPwm: 0.01, decayPwm: 0.2, pw: 0.5, pwmAmt: 0.25,
    wSaw: 1, wPulse: 0, wSub: 0, wNoise: 0, cutoff: 0.5, res: 0.4, envAmt: 0.6,
    lfoRate: 5.0, lfoCut: 0, vibMax: 0, vcaGate: false, volume: 0.8,
    legato: false, portaTime: 0, transpose: 0, arpMode: "off", arpBpm: 120,
    // switches (G50-G54)
    lfoWave: "triangle",    // "square" | "triangle" | "noise" | "random"
    vcoWave: "both",        // not a Roland switch: the source mixer levels control saw and pulse (G51 corrected)
    subOct: "1",            // "1" = square 1 oct down, "2" = square 2 oct down, "2p" = pulse 2 oct down (panel, G62)
    vcaMode: "ENV",         // "ENV" | "GATE"
    envTrig: "gate",        // "gate" | "gatetrig" | "lfo"
    pwmSrc: "env",          // PWM source: "env" | "lfo" | "man" (panel switch LFO / MAN / ENV, G56)
    portaMode: "auto",      // portamento: "auto" | "off" | "on" (panel AUTO / OFF / ON, G57)
    keyFollow: 1,           // KYBD / Key Follow slider, 0..1
    tuneCents: 0,           // TUNE knob, +-50 cents
    vcoBend: 1,             // Bend VCO slider: 1 = +-2 semitones at full lever
    vcfBend: 0,             // Bend VCF slider: 1 = +-1 octave at full lever (G69)
    seed: 101 };            // noise seed (fixed for now; not on the panel)

  class Voice {
    constructor(fs, patch) {
      this.fs = fs; this.p = Object.assign({}, DEFAULT, patch || {});
      this.stack = []; this.physical = new Set(); this.hold = false;
      this.midi = null; this.mod = 0; this.resCC = null; this.cutCC = null;
      this.ph = 0; this.phSub = 0; this.phLfo = 0; this.lfoHold = 0; this.bendNorm = 0;
      this.pwmEnv = new Env(fs, this.p.attackPwm, this.p.decayPwm, 0, this.p.release);
      this.ampEnv = new Env(fs, this.p.attack, this.p.decay, this.p.sustain, this.p.release);
      this.y = [0, 0, 0, 0]; this.baseCut = 0;
      this.pitch = null; this.target = null; this.glideAllowed = false;
      this.arpIdx = 0; this.arpDir = 1; this.arpCount = 0; this.arpGateAt = 0; this.arpFirst = false;
      this.rand = makeRng(this.p.seed);
    }
    rebuildEnvs() {
      this.pwmEnv = new Env(this.fs, this.p.attackPwm, this.p.decayPwm, 0, this.p.release);
      this.ampEnv = new Env(this.fs, this.p.attack, this.p.decay, this.p.sustain, this.p.release);
    }
    setPatch(patch) {
      this.p = Object.assign({}, this.p, patch);
      const p = this.p;
      this.pwmEnv.setParams(p.attackPwm, p.decayPwm, 0, p.release);
      this.ampEnv.setParams(p.attack, p.decay, p.sustain, p.release);
      if (this.midi !== null) this.play(this.midi, false);
    }
    arpSteps() { return Math.max(1, Math.round(this.fs * 60 / this.p.arpBpm / 4)); }
    play(midi, retrigger) {
      const eff = midi + this.p.transpose;
      this.midi = midi; this.target = eff;
      if (this.pitch === null) this.pitch = eff;
      const pos = this.cutCC !== null ? this.cutCC : this.p.cutoff;
      this.baseCut = cutoffHz(eff, pos, this.p.keyFollow);
      if (retrigger && this.p.envTrig !== "lfo") { this.ampEnv.on(); this.pwmEnv.on(); }
    }
    noteOn(midi) {
      this.physical.add(midi);
      const i = this.stack.indexOf(midi); if (i >= 0) this.stack.splice(i, 1);
      const hadNotes = this.stack.length > 0;
      this.stack.push(midi);
      if (this.p.arpMode !== "off") {
        if (!hadNotes) { this.arpCount = this.arpSteps(); this.arpFirst = true; }
        return;
      }
      const retrig = this.p.envTrig === "gatetrig" ? true : !(this.p.legato && hadNotes);
      // portamento: ON glides every note; AUTO glides only when a key is played while others are held; OFF never
      this.glideAllowed = this.p.portaMode === "on" || (this.p.portaMode === "auto" && hadNotes);
      this.play(midi, retrig);
    }
    noteOff(midi) {
      this.physical.delete(midi);
      if (this.hold) return;                                // hold keeps the notes sounding
      this.release(midi);
    }
    release(midi) {
      const i = this.stack.indexOf(midi); if (i >= 0) this.stack.splice(i, 1);
      if (this.stack.length === 0) {
        if (this.p.envTrig !== "lfo") { this.ampEnv.off(); this.pwmEnv.off(); }
        this.arpCount = 0; return;
      }
      if (this.p.arpMode === "off" && midi === this.midi) this.play(this.stack[this.stack.length - 1], false);
    }
    setHold(on) {
      this.hold = !!on;
      if (!this.hold) {                                     // releasing hold lets go of keys that are no longer down
        const keep = this.stack.filter(m => this.physical.has(m));
        const dropped = this.stack.filter(m => !this.physical.has(m));
        this.stack = keep;
        if (this.stack.length === 0) { if (this.p.envTrig !== "lfo") { this.ampEnv.off(); this.pwmEnv.off(); } this.arpCount = 0; }
        else if (dropped.length && this.p.arpMode === "off" && this.midi !== null && !keep.includes(this.midi)) this.play(keep[keep.length - 1], false);
      }
    }
    control(cc, value) {
      const v = value / 127;
      if (cc === 1) this.mod = v;
      else if (cc === 71) this.resCC = v;
      else if (cc === 74) { this.cutCC = v; if (this.midi !== null) this.play(this.midi, false); }
    }
    pitchBend(value) { this.bendNorm = Math.max(-1, Math.min(1, value / 8192)); }

    arpAdvance() {
      const notes = this.stack.slice().sort((a, b) => a - b);
      const n = notes.length, mode = this.p.arpMode;
      if (this.arpFirst) { this.arpFirst = false; this.arpDir = 1; this.arpIdx = mode === "down" ? n - 1 : 0; }
      else if (mode === "up") this.arpIdx = (this.arpIdx + 1) % n;
      else if (mode === "down") this.arpIdx = (this.arpIdx - 1 + n) % n;
      else {
        if (n > 1) {
          this.arpIdx += this.arpDir;
          if (this.arpIdx >= n - 1) { this.arpIdx = n - 1; this.arpDir = -1; }
          if (this.arpIdx <= 0) { this.arpIdx = 0; this.arpDir = 1; }
        } else this.arpIdx = 0;
      }
      if (this.arpIdx >= n) this.arpIdx = 0;
      this.play(notes[this.arpIdx], true);
    }

    render(out, n) {
      const p = this.p, fs = this.fs;
      if (this.stack.length === 0 && this.ampEnv.stage === 0) { for (let i = 0; i < n; i++) out[i] = 0; return; }
      if (this.midi === null && this.stack.length === 0) { for (let i = 0; i < n; i++) out[i] = 0; return; }
      const res = this.resCC !== null ? this.resCC : p.res;
      const k = Math.min(4.2 * res / 0.785, 5.0);
      const vib = this.mod * p.vibMax;
      const gateOn = this.stack.length > 0 ? 1 : 0;
      const glideCoef = p.portaTime > 0 ? 1 - Math.exp(-1 / (fs * Math.max(p.portaTime / 3, 1e-4))) : 1;
      const arpOn = p.arpMode !== "off" && this.stack.length > 0;
      const stepLen = this.arpSteps();
      const sawOn = p.vcoWave !== "pulse" ? 1 : 0, pulseOn = p.vcoWave !== "saw" ? 1 : 0;
      const subDiv = (p.subOct === "2" || p.subOct === "2p") ? 4 : 2, subOn = 1;
      const subPulse = p.subOct === "2p";
      const gateMode = p.vcaMode === "GATE" || p.vcaGate;
      for (let i = 0; i < n; i++) {
        if (arpOn) {
          this.arpCount++;
          if (this.arpCount >= stepLen) { this.arpCount = 0; this.arpGateAt = Math.round(stepLen * 0.6); this.arpAdvance(); }
          if (this.arpCount === this.arpGateAt) { this.ampEnv.off(); this.pwmEnv.off(); }
        }
        if (this.pitch !== null && this.target !== null) {
          if (this.glideAllowed && p.portaTime > 0) this.pitch += (this.target - this.pitch) * glideCoef;
          else this.pitch = this.target;
        }
        const ph0 = this.phLfo;
        this.phLfo = (ph0 + p.lfoRate / fs) % 1;
        const wrapped = this.phLfo < ph0;
        if (wrapped) this.lfoHold = this.rand() * 2 - 1;      // random: new level each LFO cycle
        if (wrapped && p.envTrig === "lfo") { this.ampEnv.on(); this.pwmEnv.on(); }
        let lfo;
        if (p.lfoWave === "square") lfo = this.phLfo < 0.5 ? 1 : -1;
        else if (p.lfoWave === "noise") lfo = this.rand() * 2 - 1;
        else if (p.lfoWave === "random") lfo = this.lfoHold;
        else lfo = 2 * Math.abs(2 * this.phLfo - 1) - 1;        // triangle (G43)
        const envPwm = this.pwmEnv.next();
        const env = this.ampEnv.next();
        const f = noteHz(this.pitch === null ? 69 : this.pitch, p.rangeOct, p.tuneCents) * Math.pow(2, (vib * lfo + 2 * this.bendNorm * p.vcoBend) / 12);
        const dt = f / fs;
        this.ph = (this.ph + dt) % 1; const t = this.ph;
        this.phSub = (this.phSub + dt / subDiv) % 1; const ts = this.phSub;
        const pwmMod = p.pwmSrc === "env" ? envPwm : p.pwmSrc === "lfo" ? lfo : 0;   // MAN = no modulation
        const duty = Math.min(0.98, Math.max(0.02, 0.5 * p.pw + p.pwmAmt * pwmMod));
        const saw = 2 * t - 1 - blep(t, dt);
        const pulse = (t < duty ? 1 : -1) - blep(t, dt) + blep((t - duty + 1) % 1, dt);
        const subDuty = subPulse ? 0.25 : 0.5;                 // G62: pulse sub taken as 25% width
        const sub = (ts < subDuty ? 1 : -1) - blep(ts, dt / subDiv) + blep((ts - subDuty + 1) % 1, dt / subDiv);
        const noise = this.rand() * 2 - 1;
        const src = sawOn * p.wSaw * MIX.saw * saw + pulseOn * p.wPulse * MIX.pulse * pulse
                  + subOn * p.wSub * MIX.sub * sub + p.wNoise * MIX.noise * noise;
        const cut = this.baseCut * Math.pow(2, p.envAmt * 4.0 * env + p.lfoCut * lfo + this.bendNorm * p.vcfBend);
        const g = 1 - Math.exp(-2 * Math.PI * Math.min(Math.max(cut, 20), fs * 0.45) / fs);
        const x = src * 0.5;
        const y = this.y;
        const u = Math.tanh(x - k * y[3]);
        y[0] += g * (u - y[0]);
        y[1] += g * (Math.tanh(y[0]) - y[1]);
        y[2] += g * (Math.tanh(y[1]) - y[2]);
        y[3] += g * (Math.tanh(y[2]) - y[3]);
        const gain = gateMode ? gateOn : env;                   // G44 / VCA switch
        out[i] = y[3] * gain * p.volume;
      }
    }
  }

  const PATCHES = {
    bass: { cutoff: 0.71, res: 0.45, envAmt: 0.7, wSaw: 1, wSub: 0.4, decay: 0.3, sustain: 0.2, vibMax: 0.02 },
    pwm: { wSaw: 0, wPulse: 1, pw: 0.4, pwmAmt: 0.35, cutoff: 0.55, res: 0.35, envAmt: 0.3,
           lfoRate: 5.5, vibMax: 0.02, attack: 0.2, decay: 0.6, sustain: 0.6, release: 0.4 },
    whistle: { wSaw: 0.05, cutoff: 0.61, res: 0.9, envAmt: 0, lfoCut: 0.08, lfoRate: 4.0,
               attack: 0.02, decay: 0.4, sustain: 0.6, release: 0.3, vcaGate: true },
  };

  const api = { Voice, Env, cutoffHz, noteHz, kcv, PATCHES, DEFAULT, MIX };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.SH101 = api;
})(typeof globalThis !== "undefined" ? globalThis : (typeof self !== "undefined" ? self : this));
</script>
